# Publishes a GitHub release with every lisp/*.lsp file attached under its
# own name, plus lisp-routines.zip with all of them and the LICENSE, so the
# README's "latest" download links always work. Release text: the section
# of CHANGELOG.md for that version. Runs when a version tag (e.g. v1.0.0)
# is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip and release notes
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          ls lisp/*.lsp
          zip -j lisp-routines.zip lisp/*.lsp LICENSE
          awk -v v="$VERSION" '
            /^##? / { on = (index($0, "## " v) == 1); next }
            on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no section for $VERSION in CHANGELOG.md"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" lisp/*.lsp lisp-routines.zip \
            --target "$GITHUB_SHA" \
            --title "LISP routines $VERSION" \
            --notes-file notes.md \
            --latest
