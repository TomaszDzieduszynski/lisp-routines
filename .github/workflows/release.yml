# Publishes a GitHub release with every lisp/*.lsp file attached under its
# own name, plus lisp-routines.zip with all of them and the LICENSE, so the
# README's "latest" download links always work. Release text: the section
# of CHANGELOG.md for that version. Runs when a version tag (e.g. v1.0.0)
# is pushed, or by hand from the Actions tab ("Run workflow"): then the
# version is the first release heading in CHANGELOG.md and the tag is
# created by the release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip and release notes
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -1)
          fi
          test -n "$VERSION" || { echo "::error::no version found"; exit 1; }
          ls lisp/*.lsp
          zip -j lisp-routines.zip lisp/*.lsp LICENSE
          awk -v v="$VERSION" '
            /^##? / { on = (index($0, "## " v) == 1); next }
            on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no section for $VERSION in CHANGELOG.md"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" lisp/*.lsp lisp-routines.zip \
            --target "$GITHUB_SHA" \
            --title "LISP routines $VERSION" \
            --notes-file notes.md \
            --latest
